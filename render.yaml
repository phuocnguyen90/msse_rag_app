services:
  - type: web
    name: apex-policy-rag-assistant
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60 "app.app:create_app()"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: FLASK_ENV
        value: production
      - key: OPENROUTER_EMBEDDING_MODEL
        value: nvidia/llama-nemotron-embed-vl-1b-v2:free
      - key: OPENROUTER_CHAT_MODEL
        value: meta-llama/llama-3.1-8b-instruct
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OPENROUTER_API_KEY
        sync: false
